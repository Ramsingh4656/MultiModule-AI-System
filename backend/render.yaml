services:
  - type: web
    name: ai-productivity-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-productivity-db
          property: connectionString

databases:
  - name: ai-productivity-db
    plan: free
    databaseName: ai_productivity